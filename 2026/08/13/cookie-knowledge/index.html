<p>.form-range::-webkit-slider-runnable-track {<br>height: 28px;<br>background: transparent;<br>}</p>

<p>.btn:not(.btn-primary, .viz-tile):is(<br>[aria-pressed&#x3D;”true”],<br>[aria-selected&#x3D;”true”],<br>.is-selected<br>) {<br>border-color: var(–primary);<br>color: var(–primary-foreground);<br>background: var(–primary);<br>}</p>
<p>.btn.viz-tile:is([aria-pressed&#x3D;”true”], [aria-selected&#x3D;”true”], .is-selected) {<br>border-color: var(–primary);<br>box-shadow: inset 0 0 0 1px var(–primary);<br>}</p>

<body>
<div id="cookie-attributes-3d">
  <div class="cookie-stage card" aria-label="Cookie 属性三维交互图。中心是 sessionId，周围是 Domain、Path、Expires/Max-Age、HttpOnly、SameSite 和 Secure。">
    <canvas id="cookie-canvas"></canvas>
    <div id="cookie-labels" aria-hidden="true"></div>
    <div class="cookie-hint text-small text-muted">拖动旋转 · 滚轮缩放 · 点击属性</div>
  </div>
  <div id="cookie-detail" class="card" aria-live="polite">
    <span class="viz-badge">sessionId</span>
    <span>登录凭证的索引；浏览器保存，服务端用它查询 Session。</span>
  </div>
</div>

<style>

  #cookie-attributes-3d .cookie-stage {

  #cookie-attributes-3d canvas {

  #cookie-attributes-3d canvas:active {

  #cookie-attributes-3d #cookie-labels {

  #cookie-attributes-3d .cookie-label {

    color: var(--card-foreground);
    white-space: nowrap;
    pointer-events: auto;
    cursor: pointer;

  #cookie-attributes-3d .cookie-label.is-selected {

  #cookie-attributes-3d .cookie-center-label {

  }

  #cookie-attributes-3d .cookie-satellite-label {
    position: absolute;
    transform: translate(-50%, -50%);

    border-radius: 999px;
    background: var(--secondary);
    color: var(--secondary-foreground);
    white-space: nowrap;
    pointer-events: none;
    font-weight: 500;
  }

  #cookie-attributes-3d .cookie-hint {
    position: absolute;
    left: 12px;
    bottom: 10px;
    pointer-events: none;
  }

  #cookie-attributes-3d #cookie-detail {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 54px;
  }

  @media (max-width: 520px) {
    #cookie-attributes-3d .cookie-stage {
      height: 430px;
    }

    #cookie-attributes-3d #cookie-detail {
      align-items: flex-start;
      flex-direction: column;
    }

</style>

<script type="module">
  import * as THREE from "https://esm.sh/three@0.180.0";
  import { OrbitControls } from "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";

  const root = document.getElementById("cookie-attributes-3d");
  const canvas = document.getElementById("cookie-canvas");
  const stage = root.querySelector(".cookie-stage");
  const labelsLayer = document.getElementById("cookie-labels");
  const detail = document.getElementById("cookie-detail");

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 1.5, 10.5);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 7;
  controls.maxDistance = 15;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.45;

  const css = getComputedStyle(root);
  const series1 = css.getPropertyValue("--viz-series-1").trim() || "#6296ff";
  const series2 = css.getPropertyValue("--viz-series-2").trim() || "#75c9a3";
  const neutral = css.getPropertyValue("--muted-foreground").trim() || "#8d96a5";
  const border = css.getPropertyValue("--border").trim() || "#69707c";

  const centerMaterial = new THREE.MeshStandardMaterial({
    color: new THREE.Color(series1),
    roughness: 0.35,
    metalness: 0.05,
    emissive: new THREE.Color(series1),
    emissiveIntensity: 0.12
  });
  const center = new THREE.Mesh(new THREE.SphereGeometry(1.28, 48, 48), centerMaterial);
  center.userData.key = "sessionId";
  scene.add(center);

  const centerLabel = document.createElement("div");
  centerLabel.className = "cookie-center-label";
  centerLabel.textContent = "Cookie";
  labelsLayer.appendChild(centerLabel);

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(3.75, 0.018, 10, 140),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(border), transparent: true, opacity: 0.55 })
  );
  ring.rotation.x = Math.PI / 2.45;
  ring.rotation.z = -0.12;
  scene.add(ring);

  const attributes = [
    { key: "Domain", angle: 0.1, detail: "控制哪些域名的请求可以携带 Cookie；设为共同父域可覆盖子域。" },
    { key: "Path", angle: 1.13, detail: "控制域名下哪些 URL 路径可以携带 Cookie；登录态通常显式设为 /。" },
    { key: "Expires / Max-Age", angle: 2.17, detail: "控制有效期：Expires 是绝对时间，Max-Age 是剩余秒数。" },
    { key: "HttpOnly", satellite: "XSS", angle: 3.23, detail: "防止 Js 通过 document.cookie 读取修改 cookie，降低 XSS 窃取凭证的风险。" },
    { key: "SameSite", satellite: "CSRF", angle: 4.28, detail: "控制跨站请求是否携带 Cookie，主要用于降低 CSRF 风险。" },
    { key: "Secure", angle: 5.33, detail: "只允许通过 HTTPS 发送 Cookie，降低传输链路被窃听的风险。" }
  ];

  const nodeGeometry = new THREE.SphereGeometry(0.52, 32, 32);
  const linePositions = [];
  const nodes = [];

  attributes.forEach((item, index) => {
    const x = Math.cos(item.angle) * 3.75;
    const y = Math.sin(item.angle) * 2.35;
    const z = Math.sin(item.angle * 1.55) * 1.05;
    const material = new THREE.MeshStandardMaterial({
      color: new THREE.Color(index % 2 ? series2 : series1),
      roughness: 0.4,
      metalness: 0.03,
      emissive: new THREE.Color(index % 2 ? series2 : series1),
      emissiveIntensity: 0.08
    });
    const node = new THREE.Mesh(nodeGeometry, material);
    node.position.set(x, y, z);
    node.userData = item;
    scene.add(node);
    nodes.push(node);
    linePositions.push(0, 0, 0, x, y, z);

    const label = document.createElement("button");
    label.type = "button";
    label.className = "cookie-label";
    label.textContent = item.key;
    label.setAttribute("aria-label", item.key + "：" + item.detail);
    label.addEventListener("click", () => selectNode(node));
    labelsLayer.appendChild(label);
    item.label = label;

    if (item.satellite) {
      const pivot = new THREE.Group();
      pivot.position.copy(node.position);
      pivot.visible = false;
      scene.add(pivot);

      const satelliteMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.2, 24, 24),
        new THREE.MeshStandardMaterial({
          color: new THREE.Color(series2),
          emissive: new THREE.Color(series2),
          emissiveIntensity: 0.28,
          roughness: 0.35
        })
      );
      satelliteMesh.position.set(0.95, 0, 0);
      pivot.add(satelliteMesh);

      const orbit = new THREE.Mesh(
        new THREE.TorusGeometry(0.95, 0.012, 8, 72),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(neutral), transparent: true, opacity: 0.52 })
      );
      orbit.position.copy(node.position);
      orbit.rotation.x = Math.PI / 2;
      orbit.visible = false;
      scene.add(orbit);

      const satelliteLabel = document.createElement("span");
      satelliteLabel.className = "cookie-satellite-label";
      satelliteLabel.textContent = item.satellite;
      satelliteLabel.style.display = "none";
      labelsLayer.appendChild(satelliteLabel);

      item.satelliteObject = { pivot, mesh: satelliteMesh, orbit, label: satelliteLabel };
    }
  });

  const lines = new THREE.LineSegments(
    new THREE.BufferGeometry().setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3)),
    new THREE.LineBasicMaterial({ color: new THREE.Color(neutral), transparent: true, opacity: 0.38 })
  );
  scene.add(lines);

  const ambient = new THREE.AmbientLight(0xffffff, 1.65);
  scene.add(ambient);
  const keyLight = new THREE.DirectionalLight(0xffffff, 2.6);
  keyLight.position.set(4, 7, 8);
  scene.add(keyLight);
  const rimLight = new THREE.PointLight(new THREE.Color(series1), 14, 16);
  rimLight.position.set(-5, -2, 4);
  scene.add(rimLight);

  const overviewPosition = new THREE.Vector3(0, 1.5, 10.5);
  const overviewTarget = new THREE.Vector3(0, 0, 0);
  let selected = null;
  let focusedAttribute = null;
  let cameraTween = null;

  function tweenCamera(target, distance, returnToOverview) {
    const startPosition = camera.position.clone();
    const startTarget = controls.target.clone();
    let endPosition;
    let endTarget;

    if (returnToOverview) {
      endPosition = overviewPosition.clone();
      endTarget = overviewTarget.clone();
    } else {
      const direction = camera.position.clone().sub(target).normalize();
      endPosition = target.clone().add(direction.multiplyScalar(distance));
      endPosition.y += 0.22;
      endTarget = target.clone();
    }

    cameraTween = {
      startPosition,
      startTarget,
      endPosition,
      endTarget,
      startedAt: performance.now(),
      duration: 780
    };
    controls.enabled = false;
  }

  function selectNode(node) {
    selected = node;
    controls.autoRotate = false;
    const isFocusNode = node.userData.key === "HttpOnly" || node.userData.key === "SameSite";
    focusedAttribute = isFocusNode ? node.userData : null;

    nodes.forEach((candidate) => {
      const active = candidate === node;
      candidate.scale.setScalar(active ? 1.35 : 1);
      candidate.material.emissiveIntensity = active ? 0.65 : 0.08;
      candidate.userData.label.classList.toggle("is-selected", active);

      const satellite = candidate.userData.satelliteObject;
      if (satellite) {
        const satelliteActive = active && isFocusNode;
        satellite.pivot.visible = satelliteActive;
        satellite.orbit.visible = satelliteActive;
        satellite.label.style.display = satelliteActive ? "block" : "none";
      }
    });

    tweenCamera(node.position, 3.65, !isFocusNode);
    detail.replaceChildren();
    const badge = document.createElement("span");
    badge.className = "viz-badge";
    badge.textContent = node.userData.key;
    const description = document.createElement("span");
    description.textContent = node.userData.detail;
    detail.append(badge, description);
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  canvas.addEventListener("pointerdown", () => { controls.autoRotate = false; });
  canvas.addEventListener("click", (event) => {
    const rect = canvas.getBoundingClientRect();
    pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
    pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const hit = raycaster.intersectObjects(nodes, false)[0];
    if (hit) selectNode(hit.object);
  });

  function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }

  function updateLabels() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    const centerProjected = center.position.clone().project(camera);
    centerLabel.style.left = ((centerProjected.x * 0.5 + 0.5) * width) + "px";
    centerLabel.style.top = ((-centerProjected.y * 0.5 + 0.5) * height) + "px";
    centerLabel.style.display = focusedAttribute ? "none" : "block";
    attributes.forEach((item, index) => {
      const projected = nodes[index].position.clone().project(camera);
      const visible = projected.z < 1;
      const visibleInCurrentMode = !focusedAttribute || item === focusedAttribute;
      item.label.style.display = visible && visibleInCurrentMode ? "block" : "none";
      item.label.style.left = ((projected.x * 0.5 + 0.5) * width) + "px";
      item.label.style.top = ((-projected.y * 0.5 + 0.5) * height - 34) + "px";
      item.label.style.opacity = String(Math.max(0.48, 1 - Math.max(0, projected.z) * 0.45));

      if (item.satelliteObject && item.satelliteObject.pivot.visible) {
        const satelliteWorld = new THREE.Vector3();
        item.satelliteObject.mesh.getWorldPosition(satelliteWorld);
        const satelliteProjected = satelliteWorld.project(camera);
        item.satelliteObject.label.style.left = ((satelliteProjected.x * 0.5 + 0.5) * width) + "px";
        item.satelliteObject.label.style.top = ((-satelliteProjected.y * 0.5 + 0.5) * height - 20) + "px";
      }
    });
  }

  function updateCameraTween(now) {
    if (!cameraTween) return;
    const raw = Math.min(1, (now - cameraTween.startedAt) / cameraTween.duration);
    const eased = 1 - Math.pow(1 - raw, 3);
    camera.position.lerpVectors(cameraTween.startPosition, cameraTween.endPosition, eased);
    controls.target.lerpVectors(cameraTween.startTarget, cameraTween.endTarget, eased);
    if (raw === 1) {
      controls.enabled = true;
      cameraTween = null;
    }
  }

  const observer = new ResizeObserver(resize);
  observer.observe(stage);
  resize();

  function animate(now) {
    updateCameraTween(now);
    if (focusedAttribute && focusedAttribute.satelliteObject) {
      focusedAttribute.satelliteObject.pivot.rotation.y = now * 0.00135;
    }
    controls.update();
    center.rotation.y += selected ? 0.002 : 0.004;
    updateLabels();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
animate(performance.now());
</script>

<script id="codex-visualization-floating-ui-core" src="https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js"></script>

<script id="codex-visualization-tooltip">/* oxlint-disable typescript/no-unsafe-argument, typescript/no-unsafe-call, typescript/no-unsafe-return */

(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =>
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest("[data-tooltip]")
      : null;
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () => {
    closeTooltip(false);
    document.removeEventListener("pointerover", handlePointerOpen);
    document.removeEventListener("pointerout", handleLeave);
    document.removeEventListener("focusin", handleFocusIn);
    document.removeEventListener("focusout", handleLeave);
    document.removeEventListener("keydown", handleKeyDown);
    document.removeEventListener("contextmenu", handleContextMenu);
    tooltip = null;
  };

  document.addEventListener("pointerover", handlePointerOpen);
  document.addEventListener("pointerout", handleLeave);
  document.addEventListener("focusin", handleFocusIn);
  document.addEventListener("focusout", handleLeave);
  document.addEventListener("keydown", handleKeyDown);
  document.addEventListener("contextmenu", handleContextMenu);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
