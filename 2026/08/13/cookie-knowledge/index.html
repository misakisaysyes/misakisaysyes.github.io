<script type="module">
  import * as THREE from "https://esm.sh/three@0.180.0";
  import { OrbitControls } from "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";

  const root = document.getElementById("cookie-double-galaxy");
  const canvas = document.getElementById("cookie-galaxy-canvas");
  const stage = root.querySelector(".galaxy-stage");
  const detail = document.getElementById("cookie-galaxy-detail");
  const css = getComputedStyle(root);
  const token = name => css.getPropertyValue(name).trim();
  const colors = {
    center: token("--viz-series-1") || "#6f8cff",
    attribute: token("--viz-series-2") || "#69b995",
    scenario: token("--viz-series-3") || "#d78b62",
    child: token("--viz-series-4") || "#a884d8",
    relation: token("--viz-series-5") || "#d76383",
    relationMuted: token("--accent") || "#F59E0B",
    line: token("--border") || "#7b818b",
    text: token("--foreground") || "#20242a"
  };

  const attributes = [
    { id: "name", label: "Name=Value", detail: "Cookie 的名称和值，例如 sessionId=abc123。" },
    { id: "life", label: "Expires / Max-Age", detail: "控制 Cookie 的有效期：Expires 表示绝对过期时间；Max-Age 表示相对存活秒数。两者同时设置时，Max-Age 优先。" },
    { id: "path", label: "Path", detail: "控制 Cookie 可以发送到当前域名下的哪些 URL 路径。" },
    { id: "domain", label: "Domain", detail: "控制 Cookie 可以发送给哪些主机。" },
    { id: "secure", label: "Secure", detail: "只允许 Cookie 通过 HTTPS 发送。" },
    { id: "httponly", label: "HttpOnly", detail: "禁止 JavaScript 通过 document.cookie 读取。" },
    { id: "samesite", label: "SameSite", detail: "控制跨站请求是否携带 Cookie。" }
  ];

  const scenarios = [
    {
      id: "cross-origin-request",
      label: "跨域请求",
      detail: "跨域请求是页面向协议、主机或端口不同的源发起的请求。跨域请求发出时是否携带匹配的 Cookie，以及页面 JavaScript 是否能够读取响应，分别受到 Cookie 属性、凭据模式（fetch credentials 配置）、同源策略和 CORS 的共同约束。",
      children: [
        { id: "cors", label: "CORS", detail: "CORS（跨源资源共享）是资源服务器通过 HTTP 响应头告知浏览器允许哪个来源的页面 JavaScript 读取跨域响应的机制，用来解决同源策略阻止页面读取不同源响应的问题。<pre class='mermaid cors-sequence'>sequenceDiagram\n    autonumber\n    participant JS as 页面 JavaScript - app.example.com\n    participant B as 浏览器\n    participant S as 资源服务器 - api.example.com\n\n    JS-&gt;&gt;B: fetch 请求\n    Note right of JS: fetch('https://api.example.com')\n    Note right of JS: credentials = include\n    opt 非简单请求需要预检\n        B-&gt;&gt;S: OPTIONS 预检请求\n        Note right of B: Origin = https://app.example.com\n        Note right of B: Access-Control-Request-Method = POST\n        Note right of B: Access-Control-Request-Headers = Content-Type、Authorization\n        S--&gt;&gt;B: 返回 CORS 允许响应头\n        Note left of S: Access-Control-Allow-Origin = https://app.example.com\n        Note left of S: Access-Control-Allow-Credentials = true\n        Note left of S: Allow-Methods = POST；Allow-Headers = Content-Type、Authorization\n    end\n\n    Note over B: 校验 Cookie 属性（Domain=api.example.com、Path、SameSite、Secure、Expires/Max-Age）\n    B-&gt;&gt;S: 发送正式请求\n    Note right of B: Cookie = sessionId=abc123；theme=dark\n    S--&gt;&gt;B: 返回业务响应与 Set-Cookie\n    Note left of S: Set-Cookie = sessionId=abc123；Domain=api.example.com；Path=/；SameSite=None；Secure；HttpOnly\n\n    alt CORS 校验通过\n        B--&gt;&gt;JS: 暴露可读取的响应\n    else CORS 校验失败\n        B--xJS: JavaScript 无法读取响应\n    end</pre>" },
        { id: "same-origin-policy", label: "同源策略", detail: "同源策略是浏览器按协议、主机和端口隔离不同源资源的默认安全规则，解决恶意页面读取其他源响应和敏感数据的问题；它默认阻止页面 JavaScript 读取跨域响应。" }
      ]
    },
    { id: "share", label: "父子域共享 Cookie", detail: "例如 a.baidu.com 和 b.baidu.com 跨域但通常同站；把 Domain 设置为共同父域（如 baidu.com）即可共享 Cookie。" },
    { id: "csrf", label: "CSRF", detail: "攻击者利用浏览器自动携带 Cookie，冒充用户发起非本人意愿的请求；SameSite 可限制跨站（注意跨站和跨域的区别）携带 Cookie，从而缓解 CSRF。" },
    { id: "xss", label: "XSS", detail: "攻击者向页面注入并执行恶意 JavaScript；HttpOnly 可降低会话 Cookie 被窃取的风险，但不能阻止 XSS 本身。" }
  ];

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  const overviewPosition = new THREE.Vector3(0, 0.4, 18.5);
  camera.position.copy(overviewPosition);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  const controls = new OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 6;
  controls.maxDistance = 24;

  scene.add(new THREE.AmbientLight(0xffffff, 1.6));
  const light = new THREE.DirectionalLight(0xffffff, 2.2);
  light.position.set(5, 8, 10);
  scene.add(light);

  const centerGroup = new THREE.Group();
  const innerGroup = new THREE.Group();
  const outerGroup = new THREE.Group();
  scene.add(centerGroup, innerGroup, outerGroup);
  innerGroup.rotation.x = 0.12;
  outerGroup.rotation.x = -0.08;

  const clickable = [];
  const nodeMap = new Map();
  const satellitePivots = [];
  const crossLinks = [];
  let selected = null;
  let anchorHighlights = [];
  let cameraTween = null;
  let focused = false;

  function makeTextSprite(text, emphasized = false, compact = false) {
    const scale = Math.min(2, window.devicePixelRatio || 1);
    const fontSize = emphasized ? 55 : compact ? 38 : 42;
    const probe = document.createElement("canvas");
    const context = probe.getContext("2d");
    context.font = "500 " + fontSize + "px system-ui, sans-serif";
    const width = Math.ceil(context.measureText(text).width + 18);
    const height = fontSize + 16;
    probe.width = width * scale;
    probe.height = height * scale;
    context.scale(scale, scale);
    context.font = "500 " + fontSize + "px system-ui, sans-serif";
    context.textAlign = "center";
    context.textBaseline = "middle";
    context.fillStyle = colors.text;
    context.fillText(text, width / 2, height / 2);
    const texture = new THREE.CanvasTexture(probe);
    texture.colorSpace = THREE.SRGBColorSpace;
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false }));
    const visualWidth = Math.min(emphasized ? 3.7 : 2.85, width / height * (emphasized ? 0.98 : 0.74));
    sprite.scale.set(visualWidth, visualWidth * height / width, 1);
    sprite.renderOrder = 10;
    return sprite;
  }

  function makeMaterial(value) {
    return new THREE.MeshStandardMaterial({
      color: new THREE.Color(value), roughness: 0.36, metalness: 0.04,
      emissive: new THREE.Color(value), emissiveIntensity: 0.1
    });
  }

  function createNode(data, radius, nodeColor, parentGroup, position, kind) {
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 32, 32), makeMaterial(nodeColor));
    mesh.position.copy(position);
    mesh.userData = { ...data, kind };
    const label = makeTextSprite(data.label, kind === "center", kind === "child");
    label.position.set(0, 0, radius + 0.08);
    mesh.add(label);
    mesh.userData.labelSprite = label;
    parentGroup.add(mesh);
    clickable.push(mesh);
    nodeMap.set(data.id, mesh);
    if (data.children && data.children.length) createSatellites(mesh, data.children);
    return mesh;
  }

  function createSatellites(parentMesh, children) {
    const pivot = new THREE.Group();
    pivot.visible = false;
    parentMesh.add(pivot);
    parentMesh.userData.satellitePivot = pivot;
    pivot.userData.staticOrbit = children.some(child => ["cors", "same-origin-policy"].includes(child.id));
    pivot.visible = pivot.userData.staticOrbit;
    pivot.userData.parentMesh = parentMesh;
    pivot.userData.satelliteRadius = pivot.userData.staticOrbit ? 1.8 : 1.48;
    pivot.userData.satelliteNodes = [];
    satellitePivots.push(pivot);
    const satelliteRadius = pivot.userData.satelliteRadius;
    const orbit = new THREE.Mesh(
      new THREE.TorusGeometry(satelliteRadius, 0.014, 8, 80),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(colors.line), transparent: true, opacity: 0.55 })
    );
    pivot.add(orbit);
    const outwardAngle = Math.atan2(parentMesh.position.y, parentMesh.position.x);
    children.forEach((child, index) => {
      const angle = pivot.userData.staticOrbit
        ? outwardAngle + (index - (children.length - 1) / 2) * 2
        : index / children.length * Math.PI * 2;
      const position = new THREE.Vector3(Math.cos(angle) * satelliteRadius, Math.sin(angle) * satelliteRadius, 0.18 * (index % 2 ? 1 : -1));
      const childColor = ["cors", "same-origin-policy"].includes(child.id) ? "#FDEDE2" : colors.child;
      const mesh = createNode(child, 0.34, childColor, pivot, position, "child");
      const lineGeometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), position]);
      const spoke = new THREE.Line(lineGeometry, new THREE.LineBasicMaterial({ color: new THREE.Color(colors.line), transparent: true, opacity: 0.6 }));
      mesh.userData.satelliteSpoke = spoke;
      pivot.userData.satelliteNodes.push(mesh);
      pivot.add(spoke);
    });
  }

  function updateStaticSatellites() {
    satellitePivots.forEach(pivot => {
      if (!pivot.userData.staticOrbit) return;
      const parent = pivot.userData.parentMesh;
      const nodes = pivot.userData.satelliteNodes;
      if (!parent || !nodes || !nodes.length) return;
      const outwardAngle = Math.atan2(parent.position.y, parent.position.x);
      const radius = pivot.userData.satelliteRadius;
      nodes.forEach((node, index) => {
        const angle = outwardAngle + (index - (nodes.length - 1) / 2) * 2;
        const position = new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, 0.18 * (index % 2 ? 1 : -1));
        node.position.copy(position);
        if (node.userData.satelliteSpoke) {
          const positions = node.userData.satelliteSpoke.geometry.attributes.position.array;
          positions[3] = position.x;
          positions[4] = position.y;
          positions[5] = position.z;
          node.userData.satelliteSpoke.geometry.attributes.position.needsUpdate = true;
        }
      });
    });
  }

  const center = createNode({ id: "cookie", label: "Cookie", detail: "Cookie 的属性、使用方式与安全场景。" }, 1.12, colors.center, centerGroup, new THREE.Vector3(), "center");

  function makeRing(radius, ringColor, opacity) {
    return new THREE.Mesh(
      new THREE.TorusGeometry(radius, 0.018, 8, 160),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(ringColor), transparent: true, opacity })
    );
  }
  innerGroup.add(makeRing(3.45, colors.attribute, 0.55));
  outerGroup.add(makeRing(5.8, colors.scenario, 0.42));

  function populateOrbit(items, radius, group, nodeColor, kind, phase) {
    items.forEach((item, index) => {
      const angle = phase + index / items.length * Math.PI * 2;
      const position = new THREE.Vector3(Math.cos(angle) * radius, Math.sin(angle) * radius, Math.sin(angle * 2) * 0.28);
      createNode(item, kind === "attribute" ? 0.52 : 0.58, nodeColor, group, position, kind);
    });
  }
  populateOrbit(attributes, 3.45, innerGroup, colors.attribute, "attribute", -Math.PI / 2);
  populateOrbit(scenarios, 5.8, outerGroup, colors.scenario, "scenario", -Math.PI / 2 + 0.38);

  function createCrossLink(fromId, toId, opacity = 0.38) {
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute("position", new THREE.BufferAttribute(new Float32Array(6), 3));
    const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color: new THREE.Color(colors.relation), transparent: true, opacity }));
    scene.add(line);
    crossLinks.push({ line, from: nodeMap.get(fromId), to: nodeMap.get(toId), baseOpacity: opacity });
  }
  ["life", "path", "domain", "secure", "samesite"].forEach(id => createCrossLink(id, "cross-origin-request", 0.34));
  createCrossLink("domain", "share", 0.72);
  createCrossLink("samesite", "csrf", 0.82);
  createCrossLink("httponly", "xss", 0.82);

  function updateCrossLinks() {
    crossLinks.forEach(link => {
      const scenarioFocused = selected && selected.userData.kind === "scenario";
      const linkedToSelection = scenarioFocused && link.to === selected;
      link.line.visible = true;
      link.line.material.opacity = scenarioFocused ? (linkedToSelection ? 1 : 0.06) : link.baseOpacity;
      link.line.material.color.set(scenarioFocused && linkedToSelection ? colors.relation : colors.relationMuted);
      const from = new THREE.Vector3();
      const to = new THREE.Vector3();
      link.from.getWorldPosition(from);
      link.to.getWorldPosition(to);
      const array = link.line.geometry.attributes.position.array;
      array[0] = from.x; array[1] = from.y; array[2] = from.z;
      array[3] = to.x; array[4] = to.y; array[5] = to.z;
      link.line.geometry.attributes.position.needsUpdate = true;
    });
  }

  function updateLabelFocus() {
    const scenarioFocused = selected && selected.userData.kind === "scenario";
    const related = new Set(scenarioFocused ? [center, selected, ...anchorHighlights] : clickable);
    satellitePivots.forEach(pivot => {
      if (!pivot.userData.staticOrbit) return;
      pivot.userData.satelliteNodes.forEach(node => related.add(node));
    });
    if (scenarioFocused && selected.userData.satellitePivot) {
      selected.userData.satellitePivot.children.forEach(node => {
        if (node.userData && node.userData.labelSprite) related.add(node);
      });
    }
    clickable.forEach(node => {
      const label = node.userData.labelSprite;
      if (!label) return;
      label.material.opacity = !scenarioFocused || related.has(node) ? 1 : 0.2;
    });
  }

  function hideSatellites(except) {
    satellitePivots.forEach(pivot => { pivot.visible = pivot.userData.staticOrbit || pivot === except; });
  }

  function renderCorsSequence() {
    const diagram = detail.querySelector(".cors-sequence.mermaid");
    if (!diagram) return;
    if (window.renderMermaidDiagram) window.renderMermaidDiagram(diagram);
  }

  function showDetail(data) {
    detail.classList.toggle("cors-detail", data.id === "cors");
    if (data.id === "cors") {
      const diagramStart = data.detail.indexOf("<pre ");
      const summary = diagramStart >= 0 ? data.detail.slice(0, diagramStart) : data.detail;
      const diagram = diagramStart >= 0 ? data.detail.slice(diagramStart) : "";
      detail.innerHTML = "<div class=\"viz-detail-summary\"><span class=\"viz-badge\">" + data.label + "</span><div>" + summary + "</div></div><div class=\"viz-detail-content\">" + diagram + "</div>";
      renderCorsSequence();
      return;
    }
    detail.innerHTML = "<span class=\"viz-badge\">" + data.label + "</span><div class=\"viz-detail-content\">" + data.detail + "</div>";
  }

  function selectNode(mesh) {
    if (mesh === center) {
      resetOverview();
      return;
    }
    if (selected) {
      selected.scale.setScalar(1);
      selected.material.emissiveIntensity = 0.1;
    }
    anchorHighlights.forEach(anchor => {
      anchor.scale.setScalar(1);
      anchor.material.emissiveIntensity = 0.1;
    });
    anchorHighlights = [];
    selected = mesh;
    selected.scale.setScalar(1.15);
    selected.material.emissiveIntensity = 0.34;
    showDetail(mesh.userData);
    const pivot = mesh.userData.satellitePivot || null;
    let satelliteContainer = null;
    let ancestor = mesh.parent;
    while (ancestor && !satelliteContainer) {
      if (satellitePivots.includes(ancestor)) satelliteContainer = ancestor;
      ancestor = ancestor.parent;
    }
    hideSatellites(pivot || satelliteContainer);
    if (pivot) pivot.scale.setScalar(0.001);
    focused = true;
    if (mesh.userData.kind === "scenario") {
      if (pivot) pivot.scale.setScalar(1);
      anchorHighlights = crossLinks.filter(link => link.to === mesh).map(link => link.from);
      anchorHighlights.forEach(anchor => {
        anchor.scale.setScalar(1.18);
        anchor.material.emissiveIntensity = 0.42;
      });
    } else {
      zoomTo(mesh);
    }
    updateLabelFocus();
  }

  function zoomTo(mesh) {
    const target = new THREE.Vector3();
    mesh.getWorldPosition(target);
    const direction = camera.position.clone().sub(controls.target).normalize();
    cameraTween = {
      start: performance.now(), duration: 760,
      fromPosition: camera.position.clone(), fromTarget: controls.target.clone(),
      toPosition: target.clone().add(direction.multiplyScalar(mesh.userData.kind === "child" ? 4.4 : 6.2)),
      toTarget: target, reveal: mesh.userData.satellitePivot || null
    };
    controls.enabled = false;
  }

  function resetOverview() {
    if (selected) {
      selected.scale.setScalar(1);
      selected.material.emissiveIntensity = 0.1;
    }
    selected = null;
    anchorHighlights.forEach(anchor => {
      anchor.scale.setScalar(1);
      anchor.material.emissiveIntensity = 0.1;
    });
    anchorHighlights = [];
    updateLabelFocus();
    hideSatellites(null);
    focused = false;
    showDetail(center.userData);
    cameraTween = {
      start: performance.now(), duration: 820,
      fromPosition: camera.position.clone(), fromTarget: controls.target.clone(),
      toPosition: overviewPosition.clone(), toTarget: new THREE.Vector3(), reveal: null
    };
    controls.enabled = false;
  }

  function updateTween(now) {
    if (!cameraTween) return;
    const raw = Math.min(1, (now - cameraTween.start) / cameraTween.duration);
    const eased = 1 - Math.pow(1 - raw, 3);
    camera.position.lerpVectors(cameraTween.fromPosition, cameraTween.toPosition, eased);
    controls.target.lerpVectors(cameraTween.fromTarget, cameraTween.toTarget, eased);
    if (cameraTween.reveal) cameraTween.reveal.scale.setScalar(Math.max(0.001, eased));
    if (raw === 1) {
      controls.enabled = true;
      cameraTween = null;
    }
  }

  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  let holdTimer = null;
  let draggingAnchor = false;
  let suppressNextClick = false;

  function pickNode(event) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = (event.clientX - rect.left) / rect.width * 2 - 1;
    pointer.y = -(event.clientY - rect.top) / rect.height * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const visibleNodes = clickable.filter(mesh => {
      let object = mesh;
      while (object) {
        if (!object.visible) return false;
        object = object.parent;
      }
      return true;
    });
    return raycaster.intersectObjects(visibleNodes, false)[0] || null;
  }

  function moveAnchorOnOuterOrbit(event) {
    const rect = canvas.getBoundingClientRect();
    pointer.x = (event.clientX - rect.left) / rect.width * 2 - 1;
    pointer.y = -(event.clientY - rect.top) / rect.height * 2 + 1;
    raycaster.setFromCamera(pointer, camera);
    const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(outerGroup.getWorldQuaternion(new THREE.Quaternion())).normalize();
    const origin = outerGroup.getWorldPosition(new THREE.Vector3());
    const plane = new THREE.Plane().setFromNormalAndCoplanarPoint(normal, origin);
    const worldPoint = new THREE.Vector3();
    if (!raycaster.ray.intersectPlane(plane, worldPoint)) return;
    const localPoint = outerGroup.worldToLocal(worldPoint.clone());
    const angle = Math.atan2(localPoint.y, localPoint.x);
    const nextPosition = new THREE.Vector3(Math.cos(angle) * 5.8, Math.sin(angle) * 5.8, Math.sin(angle * 2) * 0.28);
    selected.position.copy(nextPosition);
    if (selected.userData.spoke) {
      const positions = selected.userData.spoke.geometry.attributes.position.array;
      positions[3] = nextPosition.x;
      positions[4] = nextPosition.y;
      positions[5] = nextPosition.z;
      selected.userData.spoke.geometry.attributes.position.needsUpdate = true;
    }
  }

  canvas.addEventListener("pointerdown", event => {
    const hit = pickNode(event);
    if (!hit || hit.object !== selected || selected.userData.kind !== "scenario") return;
    holdTimer = setTimeout(() => {
      draggingAnchor = true;
      suppressNextClick = true;
      controls.enabled = false;
      canvas.setPointerCapture(event.pointerId);
    }, 360);
  });

  canvas.addEventListener("pointermove", event => {
    if (!draggingAnchor) return;
    moveAnchorOnOuterOrbit(event);
  });

  function endAnchorDrag(event) {
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = null;
    if (!draggingAnchor) return;
    draggingAnchor = false;
    controls.enabled = true;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  }
  canvas.addEventListener("pointerup", endAnchorDrag);
  canvas.addEventListener("pointercancel", endAnchorDrag);
  canvas.addEventListener("contextmenu", event => event.preventDefault());

  canvas.addEventListener("click", event => {
    if (suppressNextClick) {
      suppressNextClick = false;
      return;
    }
    const hit = pickNode(event);
    if (hit) selectNode(hit.object);
    else resetOverview();
  });

  function resize() {
    const width = stage.clientWidth;
    const height = stage.clientHeight;
    renderer.setSize(width, height, false);
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
  }
  const observer = new ResizeObserver(resize);
  observer.observe(stage);
  resize();

  function animate(now) {
    updateTween(now);
    if (!focused && !cameraTween) {
      innerGroup.rotation.z += 0.00065;
      outerGroup.rotation.z -= 0.00042;
    }
    satellitePivots.forEach(pivot => {
      if (pivot.visible && !pivot.userData.staticOrbit) pivot.rotation.z += 0.008;
    });
    updateStaticSatellites();
    updateCrossLinks();
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate(performance.now());
</script>
